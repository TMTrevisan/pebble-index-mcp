name: Build Pi (ARM64) image

on:
  push:
    branches: [pi-bridge]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/tmtrevisan/pebble-index-mcp:pi-bridge
            ghcr.io/tmtrevisan/pebble-index-mcp:latest-pi-bridge
            ${{ secrets.DOCKERHUB_USERNAME }}/pebble-index-mcp:pi-bridge

      - name: Digest
        run: echo "Pushed ${{ steps.build.outputs.digest }}"
